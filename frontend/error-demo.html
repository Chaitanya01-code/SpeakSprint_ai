<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeakSprint AI - Login</title>
    <style>
        /* Auth Container */
        .auth-container {
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
          padding: 20px;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", "Oxygen",
            "Ubuntu", "Cantarell", "Fira Sans", "Droid Sans", "Helvetica Neue",
            sans-serif;
        }

        .auth-card {
          width: 100%;
          max-width: 450px;
          background: white;
          border-radius: 12px;
          box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
          overflow: hidden;
          animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
          from {
            opacity: 0;
            transform: translateY(30px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }

        /* Logo Section */
        .logo-section {
          padding: 30px 20px 20px;
          text-align: center;
          border-bottom: 1px solid #f0f0f0;
        }

        .logo {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          font-size: 20px;
          font-weight: 700;
          color: #333;
        }

        .logo-icon {
          font-size: 28px;
        }

        .logo-text {
          background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          background-clip: text;
        }

        /* Tab Navigation */
        .auth-tabs {
          display: flex;
          border-bottom: 2px solid #f0f0f0;
          background: #fafafa;
        }

        .tab-item {
          flex: 1;
          padding: 18px 20px;
          text-align: center;
          cursor: pointer;
          font-weight: 500;
          color: #999;
          border-bottom: 3px solid transparent;
          transition: all 0.3s ease;
          position: relative;
        }

        .tab-item.active {
          color: #6366f1;
          border-bottom-color: #6366f1;
          background: white;
        }

        /* Form Section */
        .auth-form-section {
          padding: 40px 30px;
        }

        .auth-title {
          margin: 0 0 10px;
          font-size: 28px;
          font-weight: 700;
          color: #333;
          text-align: center;
        }

        .auth-subtitle {
          margin: 0 0 30px;
          font-size: 14px;
          color: #999;
          text-align: center;
          line-height: 1.5;
        }

        /* Form Group */
        .form-group {
          margin-bottom: 20px;
        }

        .form-group label {
          display: block;
          margin-bottom: 8px;
          font-size: 14px;
          font-weight: 600;
          color: #333;
        }

        .input-wrapper {
          position: relative;
          display: flex;
          align-items: center;
        }

        .input-icon {
          position: absolute;
          left: 14px;
          font-size: 18px;
          pointer-events: none;
        }

        .form-group input[type="text"],
        .form-group input[type="email"],
        .form-group input[type="password"] {
          width: 100%;
          padding: 12px 12px 12px 45px;
          border: 1px solid #e0e0e0;
          border-radius: 8px;
          font-size: 14px;
          transition: all 0.3s ease;
          box-sizing: border-box;
        }

        .form-group input[type="text"]:focus,
        .form-group input[type="email"]:focus,
        .form-group input[type="password"]:focus {
          outline: none;
          border-color: #6366f1;
          box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
          background-color: #f9f9ff;
        }

        /* Form Footer */
        .form-footer {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 25px;
          font-size: 14px;
        }

        .checkbox-label {
          display: flex;
          align-items: center;
          gap: 8px;
          cursor: pointer;
          color: #666;
          font-weight: 500;
          user-select: none;
        }

        .checkbox-label input[type="checkbox"] {
          width: 18px;
          height: 18px;
          cursor: pointer;
          accent-color: #6366f1;
        }

        .forgot-password-link {
          color: #6366f1;
          text-decoration: none;
          font-weight: 500;
          transition: color 0.3s ease;
        }

        .forgot-password-link:hover {
          color: #8b5cf6;
          text-decoration: underline;
        }

        /* Auth Button */
        .auth-button {
          width: 100%;
          padding: 14px;
          margin-bottom: 20px;
          background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
          color: white;
          border: none;
          border-radius: 8px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .auth-button:hover:not(:disabled) {
          transform: translateY(-2px);
          box-shadow: 0 6px 25px rgba(99, 102, 241, 0.4);
        }

        /* Auth Switch */
        .auth-switch {
          text-align: center;
          font-size: 14px;
          color: #666;
        }

        .switch-link {
          color: #6366f1;
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        }

        .switch-link:hover {
          color: #8b5cf6;
          text-decoration: underline;
        }

        /* Error Message */
        .error-message {
          padding: 12px 14px;
          margin-bottom: 20px;
          background-color: #fee;
          color: #c00;
          border: 1px solid #fcc;
          border-radius: 6px;
          font-size: 14px;
          animation: shake 0.3s ease-out;
        }

        @keyframes shake {
          0%, 100% {
            transform: translateX(0);
          }
          25% {
            transform: translateX(-5px);
          }
          75% {
            transform: translateX(5px);
          }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo">
                    <span class="logo-icon">🎙️</span>
                    <span class="logo-text">SpeakSprint AI</span>
                </div>
            </div>

            <!-- Tab Navigation -->
            <div class="auth-tabs">
                <div class="tab-item active">
                    <span>Log in</span>
                </div>
                <div class="tab-item">
                    <span>Sign up</span>
                </div>
            </div>

            <!-- Form Section -->
            <div class="auth-form-section">
                <h1 class="auth-title">Welcome back!</h1>
                <p class="auth-subtitle">Log in to continue your speaking journey</p>

                <!-- ERROR MESSAGE DISPLAYED HERE -->
                <div class="error-message">❌ Invalid email or password. Please try again.</div>

                <form>
                    <!-- Email Input -->
                    <div class="form-group">
                        <label for="email">Email address</label>
                        <div class="input-wrapper">
                            <span class="input-icon">✉️</span>
                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email"
                                value="user@example.com"
                            />
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div class="form-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                            <input
                                type="password"
                                id="password"
                                placeholder="Enter your password"
                                value="password"
                            />
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="form-footer">
                        <label class="checkbox-label">
                            <input type="checkbox" />
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-password-link">Forgot password?</a>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="auth-button">Log in</button>
                </form>

                <!-- Sign Up Link -->
                <div class="auth-switch">
                    Don't have an account? <a href="#" class="switch-link">Sign up</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
