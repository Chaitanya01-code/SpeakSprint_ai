services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: speaksprint
      POSTGRES_USER: speaksprint
      POSTGRES_PASSWORD: speaksprint
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U speaksprint -d speaksprint"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: dockerfile
    environment:
      DB_URL: postgresql://speaksprint:speaksprint@db:5432/speaksprint
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@speaksprint.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
