services:
  backend:
    env_file:
      - path: ./.env
        required: false
    build:
      context: ./backend
      dockerfile: dockerfile
    environment:
      DB_URL: ${DB_URL:-sqlite:///./speaksprint.db}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin123}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@speaksprint.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    env_file:
      - path: ./.env
        required: false
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    environment:
      VITE_BACKEND_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend

volumes:
  frontend_node_modules:
